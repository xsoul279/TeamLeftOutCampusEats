{% extends "base.html" %}
{% block title %}Rate Pickup | CampusEats{% endblock %}

{% block content %}
<h1>Rate your pickup</h1>

<p>
    {{ reservation.listing.title }}
    from {{ reservation.listing.vendor.username }}
</p>

<form method="post"
      action="{{ url_for('ratings.rate_pickup', reservation_id=reservation.id) }}">
    <p>
        <label for="stars">Rating</label><br>
        <select id="stars" name="stars" required>
            <option value="">Choose 1 to 5 stars</option>
            {% for stars in range(1, 6) %}
            <option value="{{ stars }}"
                    {% if request.form.get('stars') == stars|string %}selected{% endif %}>
                {{ stars }} star{% if stars != 1 %}s{% endif %}
            </option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label for="comment">
            Comment (optional, up to 300 characters)
        </label><br>
        <textarea id="comment"
                  name="comment"
                  maxlength="300"
                  rows="4">{{ request.form.get('comment', '') }}</textarea>
    </p>

    <button class="button" type="submit">Submit rating</button>
</form>

<p>
    <a href="{{ url_for('reservations.view_reservations') }}">
        Back to My Reservations
    </a>
</p>
{% endblock %}
